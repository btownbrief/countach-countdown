# Pull YouTube numbers for the giveaway video + Steve's channels every 30 min.
# The API key lives only in this repo's Actions secrets (YOUTUBE_API_KEY);
# the page reads the committed data/stats.json.
name: Refresh stats

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-stats
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/refresh_stats.py
      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "actions@github.com"
          git add data/stats.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "stats: $(date -u +%H:%M) UTC"
          git pull --rebase origin main
          git push
